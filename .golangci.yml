run:
  timeout: 10m
  go: '1.21'

linters:
  disable-all: true
  enable:
    - errname
    - gosimple
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - typecheck
    - unconvert
    - unused
    - wastedassign

linters-settings:
  staticcheck:
    checks:
      - all
      - -SA1019 # suppress deprecation warnings (types.ImagePullOptions etc.)

issues:
  exclude-rules:
    # Interface/function struct signatures are inherently duplicated in mock adapters
    - path: pkg/trust-tunnel-agent/session/runtime.go
      linters:
        - dupl
    - path: pkg/trust-tunnel-agent/session/docker_adapter.go
      linters:
        - dupl
  exclude:
    - "SA1019:" # deprecated API usage (Docker SDK types.ImagePullOptions)

  max-issues-per-linter: 50
  max-same-issues: 10