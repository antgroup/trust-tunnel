name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.22']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify dependencies
        run: go mod verify

      - name: Build agent
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-X 'trust-tunnel/cmd/trust-tunnel-agent/app.Version=dev'" -o out/trust-tunnel-agent ./cmd/trust-tunnel-agent

      - name: Build client
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-X 'trust-tunnel/cmd/trust-tunnel-client/app.Version=dev'" -o out/trust-tunnel-client ./cmd/trust-tunnel-client

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          args: --timeout=5m